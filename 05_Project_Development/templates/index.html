
<!DOCTYPE html>
<html>
<head>
    <title>ComicCraft</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f1ff;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #555;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #aaa;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .story {
            margin-top: 30px;
            padding: 20px;
            background: #fafafa;
            border-radius: 10px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📚 ComicCraft</h1>

    <p class="subtitle">
        AI Comic Story Creator using Gemini Models
    </p>

    <form action="/generate" method="post">

        <textarea
            name="idea"
            placeholder="Enter your comic story idea..."
            required
        >{{ idea }}</textarea>

        <button type="submit">
            ✨ Generate Comic
        </button>

    </form>

    {% if story %}

    <div class="story">

        <h2>🎨 Generated Comic</h2>

        {{ story }}

    </div>

    {% endif %}

    <div class="footer">
        ComicCraft | Powered by Gemini AI
    </div>

</div>

</body>
</html>
